[project]
name = "ai-fiqh"
version = "0.1.0"
description = "Grounded Hanafi Fiqh Q&A and exam revision over Nur al-Idah"
requires-python = ">=3.13"
dependencies = [
    "voyageai",
    "pymupdf",
    "rank-bm25",
    "numpy",
    "pydantic",
    "python-dotenv",
    "matplotlib>=3.11.1",
    "ollama>=0.6.2",
    "openai>=3.7.0",
]

[dependency-groups]
cloud = [
    "anthropic>=1.3.0",
]
dev = [
    "pytest>=9.1.1",
]
notebook = ["jupyter", "ipykernel", "matplotlib", "nbstripout"]
ui = ["streamlit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_fiqh"]
