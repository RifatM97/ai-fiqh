# Ship the Ollama fallback image (docs/deployment.md §8).
#
# Separate from the web deploy because it is a different kind of change: an
# 11 GB image with the model baked in, a 20-40 minute build, and a GPU
# revision that needs a node of its own. It should run when its Dockerfile
# changes, not on every app commit. Same OIDC sign-in as deploy.yml.

name: Deploy Ollama

on:
  push:
    branches: [main]
    paths:
      - "docker/ollama.Dockerfile"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ollama
  cancel-in-progress: false

env:
  RG: rg-ai-fiqh-learn
  APP: ai-fiqh-ollama

jobs:
  deploy:
    name: Build and roll out
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare
        run: |
          az extension add --name containerapp --upgrade --yes --only-show-errors
          ACR=$(az acr list -g "$RG" --query "[0].name" -o tsv)
          echo "ACR=$ACR" >> "$GITHUB_ENV"
          echo "IMAGE=$ACR.azurecr.io/ai-fiqh-ollama:$GITHUB_SHA" >> "$GITHUB_ENV"

      # The model pull happens inside this build (docker/ollama.Dockerfile).
      - name: Build image
        run: az acr build --registry "$ACR" --image "ai-fiqh-ollama:$GITHUB_SHA" --file docker/ollama.Dockerfile --timeout 7200 .

      - name: Roll out
        run: az containerapp update -n "$APP" -g "$RG" --image "$IMAGE" -o none

      # Longer wait than the web app: the new revision needs its own GPU node
      # (~5½ minutes measured) and an 11 GB pull before it reports ready.
      - name: Wait for the new revision
        run: |
          for _ in $(seq 1 60); do
            latest=$(az containerapp show -n "$APP" -g "$RG" --query properties.latestRevisionName -o tsv)
            ready=$(az containerapp show -n "$APP" -g "$RG" --query properties.latestReadyRevisionName -o tsv)
            [ "$latest" = "$ready" ] && { echo "Revision $latest is ready on $IMAGE"; exit 0; }
            sleep 20
          done
          echo "::error::Revision $latest did not become ready. Check: az containerapp logs show -n $APP -g $RG --type system"
          exit 1
